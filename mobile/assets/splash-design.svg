<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark blue background -->
  <rect width="1024" height="1024" fill="#0f294d"/>
  
  <!-- Orange circle background for the R -->
  <circle cx="512" cy="280" r="200" fill="#FF9500"/>
  
  <!-- Letter R in white -->
  <text x="512" y="380" font-family="Arial, Helvetica, sans-serif" font-size="400" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">
    R
  </text>
  
  <!-- Rivers Rwanda text -->
  <text x="512" y="700" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="bold" fill="#FF9500" text-anchor="middle" dominant-baseline="middle">
    Rivers Rwanda
  </text>
</svg>