<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Favicon - simplified river and landscape -->
  <rect width="256" height="256" fill="#0f294d" rx="50"/>
  
  <defs>
    <linearGradient id="waterGradFav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="landGradFav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Simplified mountain -->
  <path d="M 20 140 L 80 80 L 140 120 L 200 70 L 256 130 L 256 256 L 0 256 Z" fill="url(#landGradFav)"/>
  
  <!-- Simple river in brand orange -->
  <path d="M 70 100 Q 90 130 110 160 Q 130 190 150 220" 
        stroke="url(#waterGradFav)" stroke-width="16" fill="none" stroke-linecap="round"/>
  
  <!-- Small house with brand colors -->
  <path d="M 180 80 L 210 60 L 240 80 Z" fill="#FFA500"/>
  <rect x="180" y="80" width="60" height="40" fill="#FF8C00"/>
  <rect x="195" y="90" width="8" height="8" fill="#87ceeb"/>
  <rect x="218" y="90" width="8" height="8" fill="#87ceeb"/>
  
  <!-- R Letter -->
  <text x="128" y="210" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#FFA500" text-anchor="middle">R</text>
</svg>